name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src tests demo --max-line-length=120
      - name: Unit tests
        run: pytest -q tests
      - name: Evaluate summarizers on labelled logs
        run: python -m src.evaluate --backends baseline
      - name: Show results in job summary
        run: |
          echo '### Summarizer results' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/results.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: summarizer-results
          path: outputs/
