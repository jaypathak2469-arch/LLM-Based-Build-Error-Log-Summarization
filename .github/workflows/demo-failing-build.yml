name: Demo failing build

on:
  workflow_dispatch:

jobs:
  broken-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Run the tests
        run: pytest -q demo/failing_test.py
